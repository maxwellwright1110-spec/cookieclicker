<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Empire</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: #071522;
    color: white;
}

/* =========================
   MAIN GAME
========================= */

.game {
    width: 100%;
    height: 100vh;
    display: grid;
    grid-template-columns: 31% 31% 38%;
    overflow: hidden;
}

/* =========================
   LEFT COOKIE AREA
========================= */

.cookie-section {
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            rgba(17, 83, 119, .95),
            rgba(5, 28, 45, .98) 65%,
            #02080d
        );
    border-right: 7px solid #5b351c;
    box-shadow:
        inset -4px 0 rgba(255,255,255,.08),
        5px 0 12px rgba(0,0,0,.5);
}

.cookie-header {
    text-align: center;
    padding-top: 45px;
    position: relative;
    z-index: 5;
}

.title {
    font-size: clamp(18px, 3vw, 27px);
    font-weight: bold;
    text-shadow: 2px 2px #000;
}

.cookie-count {
    margin-top: 12px;
    font-size: clamp(25px, 4vw, 40px);
    font-weight: bold;
    text-shadow: 2px 2px #000;
}

.per-second {
    font-size: 15px;
    margin-top: -4px;
}

/* =========================
   MINI COOKIES
========================= */

.mini-cookie {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;

    background:
        radial-gradient(circle at 25% 25%, #d99552 0 8%, transparent 9%),
        #a9612d;

    border: 3px solid #653617;
    opacity: .35;
    pointer-events: none;

    animation: moveCookie linear infinite;
}

.mini-cookie::before {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    background: #4a2410;
    border-radius: 50%;
    top: 6px;
    left: 7px;

    box-shadow:
        11px 5px #4a2410,
        5px 14px #4a2410,
        16px 17px #4a2410;
}

@keyframes moveCookie {
    from {
        transform: translateX(-70px) rotate(0deg);
    }

    to {
        transform: translateX(500px) rotate(360deg);
    }
}

/* =========================
   BIG COOKIE
========================= */

.cookie-holder {
    position: absolute;
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
    z-index: 4;
}

.big-cookie {
    width: clamp(175px, 24vw, 290px);
    height: clamp(175px, 24vw, 290px);

    border-radius: 50%;
    border: none;

    cursor: pointer;

    background:
        radial-gradient(circle at 25% 25%, #e09a57 0 3%, transparent 3.5%),
        radial-gradient(circle at 72% 22%, #6c3518 0 3%, transparent 3.5%),
        radial-gradient(circle at 42% 35%, #713819 0 4%, transparent 4.5%),
        radial-gradient(circle at 68% 47%, #663017 0 3%, transparent 3.5%),
        radial-gradient(circle at 28% 58%, #713719 0 3%, transparent 3.5%),
        radial-gradient(circle at 55% 68%, #663017 0 4%, transparent 4.5%),
        radial-gradient(circle at 76% 78%, #713719 0 3%, transparent 3.5%),
        radial-gradient(circle at 30% 82%, #603018 0 3%, transparent 3.5%),
        #b96c32;

    box-shadow:
        0 0 30px rgba(255, 255, 255, .35),
        0 0 70px rgba(180, 220, 255, .22),
        inset 10px 10px 20px rgba(255,255,255,.12),
        inset -15px -15px 25px rgba(0,0,0,.22),
        0 12px 20px rgba(0,0,0,.6);

    transition: transform .08s;
}

.big-cookie:active {
    transform: scale(.93);
}

/* =========================
   MIDDLE AREA
========================= */

.middle-section {
    position: relative;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.15),
            transparent 10%,
            transparent 90%,
            rgba(0,0,0,.18)
        ),
        #07517c;

    /* IMPORTANT:
       NO STRIPES HERE */
    border-right: 7px solid #5b351c;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.3),
        5px 0 12px rgba(0,0,0,.45);
}

/* =========================
   TOP MENU
========================= */

.menu {
    display: flex;
    justify-content: center;
    gap: 5px;
    padding: 8px;
}

.menu button {
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: bold;
    color: white;

    background:
        linear-gradient(#69442a, #392112);

    border: 2px solid #9b6a43;
    border-radius: 3px;

    padding: 8px 12px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.15),
        0 2px 4px #000;

    cursor: pointer;
}

.menu button:active {
    transform: translateY(1px);
}

/* =========================
   RIGHT STORE
========================= */

.store-section {
    background:
        linear-gradient(
            to bottom,
            #0b3c59,
            #06283e
        );

    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* STORE HEADER */

.store-header {
    text-align: center;
    padding: 20px 5px 10px;

    font-size: clamp(25px, 4vw, 38px);
    font-weight: bold;

    text-shadow: 2px 2px #000;

    border-bottom: 7px solid #633b20;
    background:
        linear-gradient(
            #0d4b6c,
            #082e46
        );
}

/* BUY BAR */

.buy-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;

    text-align: center;

    border-bottom: 3px solid #3a2416;

    background: #123f56;
}

.buy-bar button {
    border: none;
    border-right: 1px solid #456274;

    background: transparent;
    color: white;

    padding: 9px 3px;

    font-weight: bold;
    cursor: pointer;
}

/* BUILDING LIST */

.building-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

/* BUILDING */

.building {
    min-height: 86px;

    display: grid;
    grid-template-columns: 65px 1fr auto;

    align-items: center;
    gap: 8px;

    margin-bottom: 7px;

    background:
        linear-gradient(
            rgba(255,255,255,.18),
            rgba(255,255,255,.05)
        );

    border-top: 2px solid rgba(255,255,255,.2);
    border-bottom: 2px solid rgba(0,0,0,.5);

    padding: 7px;

    cursor: pointer;

    transition: background .1s;
}

.building:hover {
    background: rgba(255,255,255,.22);
}

.building-icon {
    width: 60px;
    height: 60px;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            #263b47,
            #101c23
        );

    border: 2px solid #65757d;

    font-size: 30px;
}

.building-name {
    font-size: 16px;
    font-weight: bold;
}

.building-description {
    font-size: 11px;
    opacity: .75;
    margin-top: 4px;
}

.building-count {
    font-size: 18px;
    font-weight: bold;
    opacity: .7;
}

.buy-button {
    min-width: 75px;

    border: 2px solid #8d6a48;
    border-radius: 3px;

    padding: 8px 5px;

    background:
        linear-gradient(
            #6e492d,
            #382215
        );

    color: white;

    font-family: Georgia, serif;
    font-weight: bold;

    cursor: pointer;
}

.buy-button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* =========================
   FLOATING NUMBERS
========================= */

.float-number {
    position: absolute;

    color: white;

    font-size: 23px;
    font-weight: bold;

    text-shadow: 2px 2px #000;

    pointer-events: none;

    animation: floatUp .8s ease-out forwards;

    z-index: 20;
}

@keyframes floatUp {
    from {
        opacity: 1;
        transform: translateY(0);
    }

    to {
        opacity: 0;
        transform: translateY(-80px);
    }
}

/* =========================
   SCROLLBAR
========================= */

.building-list::-webkit-scrollbar {
    width: 8px;
}

.building-list::-webkit-scrollbar-track {
    background: #062335;
}

.building-list::-webkit-scrollbar-thumb {
    background: #73502f;
    border-radius: 5px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .game {
        grid-template-columns: 32% 27% 41%;
    }

    .cookie-header {
        padding-top: 28px;
    }

    .title {
        font-size: 16px;
    }

    .cookie-count {
        font-size: 24px;
    }

    .per-second {
        font-size: 11px;
    }

    .big-cookie {
        width: 155px;
        height: 155px;
    }

    .menu {
        flex-wrap: wrap;
    }

    .menu button {
        font-size: 10px;
        padding: 5px 7px;
    }

    .store-header {
        font-size: 25px;
    }

    .building {
        grid-template-columns: 45px 1fr;
        min-height: 75px;
    }

    .building-icon {
        width: 43px;
        height: 43px;
        font-size: 22px;
    }

    .building-name {
        font-size: 12px;
    }

    .building-description {
        font-size: 9px;
    }

    .buy-button {
        grid-column: 1 / 3;
        width: 100%;
        padding: 5px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="game">

    <!-- ================= LEFT ================= -->

    <section class="cookie-section" id="cookieSection">

        <div class="cookie-header">

            <div class="title">
                Frozen Clicker's Bakery
            </div>

            <div class="cookie-count" id="cookieCount">
                0 cookies
            </div>

            <div class="per-second" id="perSecond">
                per second: 0
            </div>

        </div>

        <!-- MINI COOKIES -->

        <div class="mini-cookie"
             style="top:18%; animation-duration:13s; animation-delay:-7s;">
        </div>

        <div class="mini-cookie"
             style="top:30%; animation-duration:17s; animation-delay:-12s; transform:scale(.7);">
        </div>

        <div class="mini-cookie"
             style="top:43%; animation-duration:11s; animation-delay:-3s; transform:scale(.55);">
        </div>

        <div class="mini-cookie"
             style="top:62%; animation-duration:15s; animation-delay:-9s; transform:scale(.8);">
        </div>

        <div class="mini-cookie"
             style="top:78%; animation-duration:19s; animation-delay:-15s; transform:scale(.6);">
        </div>

        <!-- BIG COOKIE -->

        <div class="cookie-holder">

            <button
                class="big-cookie"
                id="bigCookie"
                aria-label="Click the cookie">
            </button>

        </div>

    </section>


    <!-- ================= MIDDLE ================= -->

    <section class="middle-section">

        <div class="menu">

            <button>Options</button>
            <button>Stats</button>
            <button>Info</button>
            <button>Legacy</button>

        </div>

    </section>


    <!-- ================= STORE ================= -->

    <section class="store-section">

        <div class="store-header">
            Store
        </div>

        <div class="buy-bar">

            <button>BUY</button>
            <button>SELL</button>
            <button>1</button>

        </div>

        <div class="building-list" id="buildingList"></div>

    </section>

</div>


<script>

/* =========================
   GAME DATA
========================= */

let cookies = 0;

const buildings = [

    {
        name: "Cursor",
        icon: "👆",
        description: "Automatically clicks the cookie.",
        cost: 15,
        cps: .1,
        amount: 0
    },

    {
        name: "Grandma",
        icon: "👵",
        description: "A nice grandma to bake cookies.",
        cost: 100,
        cps: 1,
        amount: 0
    },

    {
        name: "Farm",
        icon: "🌾",
        description: "Grows cookie ingredients.",
        cost: 500,
        cps: 5,
        amount: 0
    },

    {
        name: "Factory",
        icon: "🏭",
        description: "Mass-produces cookies.",
        cost: 3000,
        cps: 25,
        amount: 0
    },

    {
        name: "Mine",
        icon: "⛏️",
        description: "Mines cookie materials.",
        cost: 10000,
        cps: 100,
        amount: 0
    },

    {
        name: "Bank",
        icon: "🏦",
        description: "Generates cookie interest.",
        cost: 50000,
        cps: 500,
        amount: 0
    },

    {
        name: "Temple",
        icon: "🛕",
        description: "Ancient cookie production.",
        cost: 250000,
        cps: 2500,
        amount: 0
    },

    {
        name: "Wizard Tower",
        icon: "🧙",
        description: "Creates cookies with magic.",
        cost: 1000000,
        cps: 10000,
        amount: 0
    },

    {
        name: "Portal",
        icon: "🌀",
        description: "Brings cookies from another world.",
        cost: 5000000,
        cps: 50000,
        amount: 0
    }

];


/* =========================
   ELEMENTS
========================= */

const cookieCount =
    document.getElementById("cookieCount");

const perSecond =
    document.getElementById("perSecond");

const bigCookie =
    document.getElementById("bigCookie");

const cookieSection =
    document.getElementById("cookieSection");

const buildingList =
    document.getElementById("buildingList");


/* =========================
   FORMAT NUMBERS
========================= */

function formatNumber(number) {

    if (number < 1000) {
        return Math.floor(number);
    }

    if (number < 1000000) {
        return (number / 1000).toFixed(1) + "K";
    }

    if (number < 1000000000) {
        return (number / 1000000).toFixed(1) + "M";
    }

    if (number < 1000000000000) {
        return (number / 1000000000).toFixed(1) + "B";
    }

    return (number / 1000000000000).toFixed(1) + "T";
}


/* =========================
   TOTAL CPS
========================= */

function getCPS() {

    let total = 0;

    buildings.forEach(building => {

        total +=
            building.amount *
            building.cps;

    });

    return total;
}


/* =========================
   BUILDING COST
========================= */

function getCost(building) {

    return Math.floor(
        building.cost *
        Math.pow(1.15, building.amount)
    );

}


/* =========================
   UPDATE GAME
========================= */

function updateGame() {

    cookieCount.textContent =
        formatNumber(cookies) +
        " cookies";

    perSecond.textContent =
        "per second: " +
        formatNumber(getCPS());

    renderBuildings();
}


/* =========================
   BUILDINGS
========================= */

function renderBuildings() {

    buildingList.innerHTML = "";

    buildings.forEach((building, index) => {

        const cost =
            getCost(building);

        const item =
            document.createElement("div");

        item.className =
            "building";

        item.innerHTML = `

            <div class="building-icon">
                ${building.icon}
            </div>

            <div>

                <div class="building-name">
                    ${building.name}
                </div>

                <div class="building-description">
                    ${building.description}
                </div>

                <div class="building-count">
                    Owned: ${building.amount}
                </div>

            </div>

            <button
                class="buy-button"
                ${cookies < cost ? "disabled" : ""}>

                🍪 ${formatNumber(cost)}

            </button>
        `;

        const button =
            item.querySelector(".buy-button");

        button.addEventListener("click", () => {

            if (cookies >= cost) {

                cookies -= cost;

                building.amount++;

                updateGame();

            }

        });

        buildingList.appendChild(item);

    });

}


/* =========================
   COOKIE CLICK
========================= */

bigCookie.addEventListener(
    "click",
    function(event) {

        cookies++;

        createFloatingNumber(
            event.clientX,
            event.clientY,
            "+1"
        );

        updateGame();

    }
);


/* =========================
   FLOATING NUMBER
========================= */

function createFloatingNumber(
    x,
    y,
    text
) {

    const number =
        document.createElement("div");

    number.className =
        "float-number";

    number.textContent =
        text;

    const rect =
        cookieSection.getBoundingClientRect();

    number.style.left =
        (x - rect.left) + "px";

    number.style.top =
        (y - rect.top) + "px";

    cookieSection.appendChild(number);

    setTimeout(() => {

        number.remove();

    }, 800);

}


/* =========================
   AUTOMATIC PRODUCTION
========================= */

setInterval(() => {

    const cps =
        getCPS();

    cookies += cps / 10;

    updateGame();

}, 100);


/* =========================
   START
========================= */

updateGame();

</script>

</body>
</html>
