<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Empire</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#071a36;
    color:white;
}

#game{
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-columns:29% 43% 28%;
    background:linear-gradient(135deg,#061a38,#0b4f91,#082c5c);
}

/* ================= COOKIE SIDE ================= */

#left{
    height:100vh;
    text-align:center;
    background:linear-gradient(180deg,#0b5aa5,#08366b);
    border-right:3px solid #03152e;
    position:relative;
}

#title{
    font-size:25px;
    font-weight:bold;
    padding-top:13px;
    text-shadow:2px 2px #00152e;
}

#subtitle{
    font-size:11px;
    color:#cfe8ff;
    margin-top:2px;
}

#cookieCount{
    margin-top:13px;
    font-size:25px;
    font-weight:bold;
    text-shadow:2px 2px #00152e;
}

#perSecond{
    color:#a9ddff;
    font-size:13px;
    margin-top:3px;
}

#cookieArea{
    position:absolute;
    left:0;
    right:0;
    top:125px;
    bottom:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

#cookie{
    width:min(280px,80%);
    aspect-ratio:1;
    border-radius:50%;
    cursor:pointer;

    background:
        radial-gradient(circle at 25% 23%,#6e3916 0 4%,transparent 4.7%),
        radial-gradient(circle at 62% 18%,#55270f 0 3%,transparent 3.8%),
        radial-gradient(circle at 78% 35%,#733b18 0 4%,transparent 4.7%),
        radial-gradient(circle at 38% 43%,#54270f 0 3%,transparent 3.8%),
        radial-gradient(circle at 68% 58%,#54270f 0 4%,transparent 4.7%),
        radial-gradient(circle at 23% 68%,#713715 0 3.5%,transparent 4.2%),
        radial-gradient(circle at 51% 78%,#55270f 0 4%,transparent 4.7%),
        radial-gradient(circle at 83% 76%,#733b18 0 3%,transparent 3.8%),
        #c9782d;

    border:10px solid #8a491d;

    box-shadow:
        inset 0 0 25px rgba(70,30,5,.8),
        0 10px 25px rgba(0,0,0,.7);

    transition:.06s;
}

#cookie:hover{
    filter:brightness(1.1);
}

#cookie:active{
    transform:scale(.93);
}

/* ================= BUILDINGS ================= */

#middle{
    height:100vh;
    overflow:hidden;
    background:#082e5c;
    border-right:3px solid #03152e;
}

.panelHeader{
    height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px;

    background:linear-gradient(#1267ad,#084477);

    border-bottom:2px solid #031b38;

    font-size:15px;
    font-weight:bold;
}

#buyMode{
    display:flex;
    gap:3px;
}

#buyMode button{
    border:1px solid #6db8ed;
    background:#083665;
    color:white;
    padding:4px 7px;
    cursor:pointer;
    border-radius:3px;
    font-size:11px;
}

#buyMode button.active{
    background:#2196e0;
}

/*
   ONLY THIS SECTION SCROLLS
*/

#buildings{
    height:calc(100vh - 48px);

    padding:7px;

    overflow-y:auto;
    overflow-x:hidden;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    grid-auto-rows:minmax(105px,1fr);

    gap:7px;

    align-content:start;
}

/* Scrollbar */

#buildings::-webkit-scrollbar{
    width:10px;
}

#buildings::-webkit-scrollbar-track{
    background:#05254a;
}

#buildings::-webkit-scrollbar-thumb{
    background:#1c72ae;
    border-radius:5px;
}

#buildings::-webkit-scrollbar-thumb:hover{
    background:#2b91d2;
}

/* SQUARE BUILDING CARDS */

.building{
    aspect-ratio:1 / 1;

    min-width:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:space-between;

    text-align:center;

    padding:7px;

    background:
        linear-gradient(
            145deg,
            #105384,
            #082e54
        );

    border:2px solid #1c70a7;

    border-radius:6px;

    cursor:pointer;

    overflow:hidden;

    transition:
        transform .08s,
        background .08s,
        border-color .08s;
}

.building:hover{
    background:
        linear-gradient(
            145deg,
            #176b9f,
            #0b3f6d
        );

    border-color:#48a7df;

    transform:scale(1.02);
}

.building:active{
    transform:scale(.97);
}

.building.locked{
    opacity:.48;
}

.buildingIcon{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

    padding-top:2px;
}

.buildingInfo{
    width:100%;
    min-width:0;
}

.buildingName{
    font-size:11px;
    font-weight:bold;

    line-height:1.05;

    white-space:normal;

    overflow:hidden;
}

.buildingDesc{
    font-size:8px;
    color:#b8ddf5;

    margin-top:3px;
}

.buildingPrice{
    color:#ffe082;

    font-size:9px;

    margin-top:4px;

    white-space:nowrap;
}

.buildingOwned{
    width:100%;

    font-size:17px;

    font-weight:bold;

    color:#a9dcff;

    padding-bottom:2px;
}

/* ================= UPGRADES ================= */

#right{
    height:100vh;
    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #06315e,
            #041d3a
        );
}

.upgradeHeader{
    height:48px;

    display:flex;
    align-items:center;

    padding:0 12px;

    background:
        linear-gradient(
            #1267ad,
            #084477
        );

    border-bottom:2px solid #031b38;

    font-size:15px;
    font-weight:bold;
}

#upgradesArea{
    height:calc(100vh - 48px);

    padding:8px;

    overflow:hidden;
}

#upgradeGrid{
    height:100%;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    grid-auto-rows:75px;

    gap:6px;
}

.upgrade{
    background:#0b4778;

    border:1px solid #328bc3;

    border-radius:5px;

    padding:6px;

    cursor:pointer;

    overflow:hidden;
}

.upgrade:hover{
    background:#0e5b96;
}

.upgrade.unaffordable{
    opacity:.4;
}

.upgradeIcon{
    font-size:22px;
}

.upgradeName{
    font-size:10px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.upgradePrice{
    color:#ffe082;
    font-size:9px;
}

/* ================= GOLDEN COOKIE ================= */

#goldenCookie{
    position:fixed;

    display:none;

    width:75px;
    height:75px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff7a8,
            #ffd21c 55%,
            #f19b00
        );

    border:4px solid white;

    box-shadow:0 0 30px #ffc400;

    cursor:pointer;

    z-index:100;

    animation:goldSpin 1s infinite alternate;
}

@keyframes goldSpin{

    from{
        transform:scale(.9) rotate(-8deg);
    }

    to{
        transform:scale(1.08) rotate(8deg);
    }

}

/* ================= CLICK NUMBERS ================= */

.clickNumber{
    position:fixed;

    pointer-events:none;

    font-size:20px;

    font-weight:bold;

    color:white;

    text-shadow:1px 1px #000;

    animation:floatUp 1s forwards;

    z-index:200;
}

@keyframes floatUp{

    to{
        transform:translateY(-80px);
        opacity:0;
    }

}

/* ================= NOTIFICATION ================= */

#notification{
    position:fixed;

    bottom:15px;
    left:50%;

    transform:translateX(-50%);

    background:#06182d;

    border:2px solid #4fa5dd;

    box-shadow:0 4px 15px #000;

    padding:10px 20px;

    display:none;

    z-index:300;

    font-size:13px;
}

/* ================= SMALL SCREENS ================= */

@media(max-width:850px){

    #game{
        grid-template-columns:28% 45% 27%;
    }

    #title{
        font-size:18px;
    }

    #cookieCount{
        font-size:18px;
    }

    #cookie{
        width:80%;
    }

    #buildings{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        grid-auto-rows:minmax(100px,1fr);
    }

    .buildingIcon{
        font-size:22px;
    }

    .buildingName{
        font-size:9px;
    }

    .buildingDesc{
        font-size:7px;
    }

    .buildingPrice{
        font-size:8px;
    }

    .buildingOwned{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- COOKIE -->

    <section id="left">

        <div id="title">
            🍪 COOKIE EMPIRE
        </div>

        <div id="subtitle">
            Bake cookies. Buy stuff. Get rich.
        </div>

        <div id="cookieCount">
            0 cookies
        </div>

        <div id="perSecond">
            per second: 0
        </div>

        <div id="cookieArea">
            <div id="cookie"></div>
        </div>

    </section>


    <!-- BUILDINGS -->

    <section id="middle">

        <div class="panelHeader">

            <span>BUILDINGS</span>

            <div id="buyMode">

                <button
                    data-mode="1"
                    class="active">
                    1
                </button>

                <button data-mode="10">
                    10
                </button>

                <button data-mode="100">
                    100
                </button>

            </div>

        </div>

        <div id="buildings"></div>

    </section>


    <!-- UPGRADES -->

    <section id="right">

        <div class="upgradeHeader">
            🛠️ UPGRADES
        </div>

        <div id="upgradesArea">

            <div id="upgradeGrid"></div>

        </div>

    </section>

</div>


<div id="goldenCookie">
    🍪
</div>

<div id="notification"></div>


<script>

/* ================= GAME STATE ================= */

let cookies = 0;
let totalCookies = 0;
let clickPower = 1;
let buyMode = 1;
let goldenCookies = 0;
let frenzyUntil = 0;


/* ================= BUILDINGS ================= */

let buildings = [

    {
        name:"Cursor",
        icon:"👆",
        base:15,
        cps:0.1,
        owned:0
    },

    {
        name:"Grandma",

    },

    {

        icon:"🌾",
        base:1100,
        cps:8,
        owned:0
    },

    {
        name:"Mine",
        icon:"⛏️",
        base:12000,
        cps:47,
        owned:0
    },

    {
        name:"Factory",

        base:130000,
        cps:260,
        owned:0
    },

    {
        name:"Bank",
        icon:"🏦",

        owned:0
    },

    {
        name:"Temple",
        icon:"⛪",

        cps:7800,
        owned:0
    },

    {
        name:"Wizard Tower",

        base:330000000,
        cps:44000,
        owned:0
    },

    {
        name:"Shipment",
        icon:"🚀",
        base:5100000000,
        cps:260000,
        owned:0
    },

        icon:"⚗️",

    {

    },

    {
        name:"Antimatter Condenser",
        icon:"⚛️",
        base:170000000000000,
        cps:430000000,
        owned:0
    },

    {
        name:"Prism",
        icon:"🌈",
        base:2100000000000000,
        cps:2900000000,
        owned:0
    },

    {
        name:"Chancemaker",
        icon:"🎰",
        base:26000000000000000,
        cps:19000000000,
        owned:0
    },

    {
        name:"Fractal Engine",
        icon:"🔷",
        base:310000000000000000,
        cps:120000000000,
        owned:0
    },

    {
        name:"Javascript Console",
        icon:"💻",
        base:71000000000000000000,
        cps:720000000000,
        owned:0
    },

    {
        name:"Idleverse",
        icon:"🌌",
        base:12000000000000000000000,
        cps:4500000000000,
        owned:0
    },

    {
        name:"Cortex Baker",
        icon:"🧠",
        base:1900000000000000000000000,
        cps:27000000000000,
        owned:0
    },

    {
        name:"You",
        icon:"👤",
        base:540000000000000000000000000,
        cps:160000000000000,
        owned:0
    }

];


/* ================= UPGRADES ================= */

let upgrades = [

    {
        name:"Better Fingers",
        icon:"☝️",
        price:100,
        type:"click",
        mult:2
    },

    {
        name:"Strong Fingers",
        icon:"💪",
        price:1000,
        type:"click",
        mult:2
    },

    {
        name:"Golden Dough",
        icon:"🟡",
        price:10000,
        type:"click",
        mult:2
    },

    {
        name:"Reinforced Cursor",
        icon:"🖱️",
        price:500,
        type:"building",
        building:0,
        mult:2
    },

    {
        name:"Grandma's Recipe",
        icon:"📖",
        price:3000,
        type:"building",
        building:1,
        mult:2
    },

    {
        name:"Farm Science",
        icon:"🌱",
        price:15000,
        type:"building",
        building:2,
        mult:2
    },

    {
        name:"Better Pickaxes",
        icon:"⛏️",
        price:75000,
        type:"building",
        building:3,
        mult:2
    },

    {
        name:"Factory Automation",
        icon:"⚙️",
        price:300000,
        type:"building",
        building:4,
        mult:2
    },

    {
        name:"Banking System",
        icon:"💰",
        price:1500000,
        type:"building",
        building:5,

    },

    {
        name:"Temple Blessing",
        icon:"✨",
        price:7000000,
        type:"building",
        building:6,

    },

    {
        name:"Magic Research",
        icon:"🔮",
        price:30000000,
        type:"building",
        building:7,
        mult:2
    },

    {
        name:"Rocket Engineering",
        icon:"🚀",
        price:150000000,
        type:"building",
        building:8,
        mult:2
    },

    {
        name:"Advanced Alchemy",
        icon:"🧪",
        price:800000000,
        type:"building",
        building:9,
        mult:2
    },

    {
        name:"Portal Control",
        icon:"🌀",
        price:4000000000,
        type:"building",
        building:10,
        mult:2
    },

    {
        name:"Time Mastery",
        icon:"⌛",
        price:20000000000,
        type:"building",
        building:11,
        mult:2
    }

];

let boughtUpgrades = [];


/* ================= NUMBER FORMAT ================= */

function fmt(n){

    if(!isFinite(n))
        return "∞";

    if(n<1000)
        return Math.floor(n).toLocaleString();

    const units=[
        "K","M","B","T","Qa",
        "Qi","Sx","Sp","Oc","No","Dc"
    ];

    let tier=Math.floor(
        Math.log10(n)/3
    );

    if(tier>units.length)
        return n.toExponential(2);

    return(
        n/Math.pow(1000,tier)
    ).toFixed(2)+units[tier-1];
}


/* ================= MULTIPLIERS ================= */

function buildingMultiplier(index){

    let mult=1;

    upgrades.forEach((u,i)=>{

        if(
            u.type==="building" &&
            u.building===index &&
            boughtUpgrades.includes(i)
        ){

            mult*=u.mult;

        }

    });

    return mult;
}


/* ================= CPS ================= */

function getCps(){

    let cps=0;

    buildings.forEach((b,i)=>{

        cps+=
            b.owned*
            b.cps*
            buildingMultiplier(i);

    });

    if(Date.now()<frenzyUntil)
        cps*=7;

    return cps;
}


/* ================= COOKIE ================= */

document.getElementById(
    "cookie"
).onclick=function(e){

    let amount=clickPower;

    if(Date.now()<frenzyUntil)
        amount*=7;

    cookies+=amount;
    totalCookies+=amount;

    floatingNumber(
        "+"+fmt(amount),
        e.clientX,
        e.clientY
    );

    update();
};


/* ================= FLOATING NUMBER ================= */

function floatingNumber(text,x,y){

    let el=document.createElement("div");

    el.className="clickNumber";

    el.textContent=text;

    el.style.left=x+"px";
    el.style.top=y+"px";

    document.body.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },1000);
}


/* ================= BULK COST ================= */

function bulkCost(index,amount){

    let total=0;

    for(let i=0;i<amount;i++){

        total+=Math.floor(
            buildings[index].base*
            Math.pow(
                1.15,
                buildings[index].owned+i
            )
        );

    }

    return total;
}


/* ================= BUY BUILDING ================= */

function buyBuilding(index){

    let amount=buyMode;

    let cost=bulkCost(
        index,
        amount
    );

    if(cookies<cost)
        return;

    cookies-=cost;

    buildings[index].owned+=amount;

    showNotification(
        "+"+
        amount+
        " "+
        buildings[index].name
    );

    update();
}


/* ================= RENDER BUILDINGS ================= */

function renderBuildings(){

    let container=
        document.getElementById(
            "buildings"
        );

    container.innerHTML="";

    buildings.forEach((b,i)=>{

        let cost=
            bulkCost(
                i,
                buyMode
            );

        let div=
            document.createElement("div");

        div.className="building";

        if(cookies<cost)
            div.classList.add("locked");

        div.innerHTML=`

            <div class="buildingIcon">
                ${b.icon}
            </div>

            <div class="buildingInfo">

                <div class="buildingName">
                    ${b.name}
                </div>

                <div class="buildingDesc">
                    ${fmt(
                        b.cps*
                        buildingMultiplier(i)
                    )}/sec
                </div>

                <div class="buildingPrice">
                    🍪 ${fmt(cost)}
                </div>

            </div>

            <div class="buildingOwned">
                ${b.owned}
            </div>

        `;

        div.onclick=
            ()=>buyBuilding(i);

        container.appendChild(div);

    });
}


/* ================= UPGRADES ================= */

function buyUpgrade(index){

    if(boughtUpgrades.includes(index))
        return;

    let u=upgrades[index];

    if(cookies<u.price)
        return;

    cookies-=u.price;

    boughtUpgrades.push(index);

    if(u.type==="click")
        clickPower*=u.mult;

    showNotification(
        "Upgrade bought: "+
        u.name
    );

    update();
}


function renderUpgrades(){

    let grid=
        document.getElementById(
            "upgradeGrid"
        );

    grid.innerHTML="";

    upgrades.forEach((u,i)=>{

        if(boughtUpgrades.includes(i))
            return;

        let div=
            document.createElement("div");

        div.className="upgrade";

        if(cookies<u.price)
            div.classList.add(
                "unaffordable"
            );

        div.innerHTML=`

            <div class="upgradeIcon">
                ${u.icon}
            </div>

            <div class="upgradeName">
                ${u.name}
            </div>

            <div class="upgradePrice">
                🍪 ${fmt(u.price)}
            </div>

        `;

        div.onclick=
            ()=>buyUpgrade(i);

        grid.appendChild(div);

    });
}


/* ================= GOLDEN COOKIE ================= */

function spawnGolden(){

    let g=
        document.getElementById(
            "goldenCookie"
        );

    g.style.display="block";

    g.style.left=
        Math.max(
            20,
            Math.random()*
            (innerWidth-110)
        )+"px";

    g.style.top=
        Math.max(
            60,
            Math.random()*
            (innerHeight-130)
        )+"px";

    setTimeout(()=>{
        g.style.display="none";
    },12000);
}


document.getElementById(
    "goldenCookie"
).onclick=()=>{

    let g=
        document.getElementById(
            "goldenCookie"
        );

    g.style.display="none";

    goldenCookies++;

    if(Math.random()<.5){

        let reward=
            Math.max(
                cookies*.15,
                getCps()*60
            );

        cookies+=reward;
        totalCookies+=reward;

        showNotification(
            "Lucky! +"+
            fmt(reward)+
            " cookies"
        );

    }else{

        frenzyUntil=
            Date.now()+77000;

        showNotification(
            "COOKIE FRENZY! 7× production!"
        );

    }

    update();
};


setInterval(()=>{

    if(Math.random()<.35)
        spawnGolden();

},30000);


/* ================= BUY MODE ================= */

document.querySelectorAll(
    "#buyMode button"
).forEach(button=>{

    button.onclick=()=>{

        document.querySelectorAll(
            "#buyMode button"
        ).forEach(x=>
            x.classList.remove(
                "active"
            )
        );

        button.classList.add(
            "active"
        );

        buyMode=
            Number(
                button.dataset.mode
            );

        renderBuildings();

    };

});


/* ================= NOTIFICATION ================= */

let notificationTimer;

function showNotification(text){

    let n=
        document.getElementById(
            "notification"
        );

    n.textContent=text;

    n.style.display="block";

    clearTimeout(
        notificationTimer
    );

    notificationTimer=
        setTimeout(()=>{
            n.style.display="none";
        },2500);
}


/* ================= SAVE ================= */

function saveGame(){

    localStorage.setItem(
        "cookieEmpire",

        JSON.stringify({

            cookies,
            totalCookies,
            clickPower,
            goldenCookies,

            buildings,
            boughtUpgrades

        })
    );
}


/* ================= LOAD ================= */

function loadGame(){

    let save=
        localStorage.getItem(
            "cookieEmpire"
        );

    if(!save)
        return;

    try{

        let data=
            JSON.parse(save);

        cookies=data.cookies||0;
        totalCookies=data.totalCookies||0;
        clickPower=data.clickPower||1;
        goldenCookies=data.goldenCookies||0;

        if(data.buildings){

            data.buildings.forEach(
                (oldBuilding,i)=>{

                    if(
                        buildings[i] &&
                        typeof oldBuilding.owned
                        ==="number"
                    ){

                        buildings[i].owned=
                            oldBuilding.owned;

                    }

                }
            );

        }

        boughtUpgrades=
            data.boughtUpgrades||[];

    }catch(e){

        console.log(
            "Save could not be loaded."
        );

    }
}


/* ================= UPDATE ================= */

function update(){

    let cps=getCps();

    document.getElementById(
        "cookieCount"
    ).textContent=
        fmt(cookies)+
        " cookies";

    document.getElementById(
        "perSecond"
    ).textContent=
        "per second: "+
        fmt(cps);

    renderBuildings();
    renderUpgrades();

    saveGame();
}


/* ================= PRODUCTION ================= */

let lastTime=Date.now();

setInterval(()=>{

    let now=Date.now();

    let elapsed=
        (now-lastTime)/1000;

    lastTime=now;

    let amount=
        getCps()*elapsed;

    cookies+=amount;
    totalCookies+=amount;

    update();

},100);


/* ================= START ================= */

loadGame();

update();

</script>

</body>
</html>
