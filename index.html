<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Empire</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1976d2;
    color: white;
    overflow: hidden;
}

.game {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOP */
.top {
    text-align: center;
    padding: 12px 10px 6px;
    flex-shrink: 0;
}

h1 {
    margin: 0;
    font-size: 28px;
}

#cookies {
    font-size: 32px;
    font-weight: bold;
    margin-top: 4px;
}

#cps {
    font-size: 15px;
    opacity: .9;
}

/* MAIN AREA */
.main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 15px;
    padding: 10px 15px 15px;
}

/* COOKIE AREA */
.cookie-area {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background: rgba(0, 0, 0, .12);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* MINI COOKIES */
.mini-cookie {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #b86f32;
    border: 3px solid #75401c;
    box-shadow: inset 4px 4px rgba(255,255,255,.12);
    pointer-events: none;
    animation: cookieMove linear infinite;
    opacity: .7;
}

.mini-cookie::before,
.mini-cookie::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    background: #542b13;
    border-radius: 50%;
}

.mini-cookie::before {
    top: 8px;
    left: 8px;
    box-shadow:
        13px 4px #542b13,
        7px 14px #542b13,
        19px 18px #542b13;
}

.mini-cookie::after {
    top: 20px;
    left: 14px;
    box-shadow: -7px -2px #542b13;
}

@keyframes cookieMove {
    from {
        transform: translateX(-100px) rotate(0deg);
    }
    to {
        transform: translateX(calc(100vw + 100px)) rotate(360deg);
    }
}

/* BIG COOKIE */
.big-cookie {
    width: min(310px, 45vw);
    height: min(310px, 45vw);
    max-width: 310px;
    max-height: 310px;
    min-width: 180px;
    min-height: 180px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 25% 25%, #d8944d 0 4%, transparent 5%),
        radial-gradient(circle at 70% 30%, #6f3d1c 0 2.5%, transparent 3%),
        radial-gradient(circle at 40% 65%, #6f3d1c 0 3%, transparent 3.5%),
        radial-gradient(circle at 72% 72%, #6f3d1c 0 2.5%, transparent 3%),
        radial-gradient(circle at 30% 80%, #6f3d1c 0 2%, transparent 2.5%),
        #b86f32;
    border: 10px solid #753e1b;
    box-shadow:
        inset 10px 10px 0 rgba(255,255,255,.08),
        inset -12px -12px 0 rgba(0,0,0,.15),
        0 12px 25px rgba(0,0,0,.25);
    cursor: pointer;
    position: relative;
    z-index: 5;
    transition: transform .08s;
}

.big-cookie:active {
    transform: scale(.94);
}

.big-cookie:hover {
    transform: scale(1.025);
}

/* BUILDINGS */
.buildings {
    background: rgba(0,0,0,.12);
    border-radius: 18px;
    padding: 10px;
    min-height: 0;
    overflow-y: auto;
}

.buildings h2 {
    text-align: center;
    margin: 4px 0 10px;
    font-size: 21px;
}

.building {
    width: 100%;
    aspect-ratio: 1 / .42;
    min-height: 90px;
    margin-bottom: 9px;
    padding: 10px;
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 12px;
    background: rgba(255,255,255,.12);
    display: grid;
    grid-template-columns: 65px 1fr auto;
    align-items: center;
    gap: 9px;
}

.building-icon {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    background: rgba(255,255,255,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.building-name {
    font-weight: bold;
    font-size: 16px;
}

.building-info {
    font-size: 12px;
    opacity: .85;
    margin-top: 3px;
}

.buy {
    border: none;
    border-radius: 9px;
    padding: 9px 10px;
    background: #fff;
    color: #175b9e;
    font-weight: bold;
    cursor: pointer;
}

.buy:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* FLOATING +1 */
.float {
    position: absolute;
    color: white;
    font-size: 22px;
    font-weight: bold;
    pointer-events: none;
    z-index: 10;
    animation: floatUp .8s ease-out forwards;
}

@keyframes floatUp {
    from {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    to {
        opacity: 0;
        transform: translateY(-80px) scale(1.25);
    }
}

/* MOBILE */
@media (max-width: 700px) {
    .main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 42%;
    }

    .cookie-area {
        min-height: 0;
    }

    .buildings {
        min-height: 0;
    }

    .big-cookie {
        width: 210px;
        height: 210px;
        min-width: 210px;
        min-height: 210px;
    }

    .building {
        min-height: 75px;
        grid-template-columns: 50px 1fr auto;
    }

    .building-icon {
        width: 46px;
        height: 46px;
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="top">
        <h1>🍪 Cookie Empire</h1>
        <div id="cookies">0 cookies</div>
        <div id="cps">0 cookies per second</div>
    </div>

    <div class="main">

        <div class="cookie-area" id="cookieArea">

            <!-- Mini cookies -->
            <div class="mini-cookie" style="top:8%; animation-duration:12s; animation-delay:-5s;"></div>
            <div class="mini-cookie" style="top:23%; animation-duration:16s; animation-delay:-11s; transform:scale(.7);"></div>
            <div class="mini-cookie" style="top:40%; animation-duration:13s; animation-delay:-2s; transform:scale(.55);"></div>
            <div class="mini-cookie" style="top:58%; animation-duration:18s; animation-delay:-14s; transform:scale(.8);"></div>
            <div class="mini-cookie" style="top:76%; animation-duration:14s; animation-delay:-8s; transform:scale(.6);"></div>
            <div class="mini-cookie" style="top:88%; animation-duration:20s; animation-delay:-17s; transform:scale(.75);"></div>

            <button class="big-cookie" id="bigCookie" aria-label="Click cookie"></button>

        </div>

        <div class="buildings">
            <h2>🏢 Buildings</h2>
            <div id="buildingList"></div>
        </div>

    </div>
</div>

<script>
let cookies = 0;
let buildings = [];

const buildingTypes = [
    {
        name: "Cursor",
        icon: "👆",
        baseCost: 15,
        cps: 0.1
    },
    {
        name: "Grandma",
        icon: "👵",
        baseCost: 100,
        cps: 1
    },
    {
        name: "Farm",
        icon: "🌾",
        baseCost: 500,
        cps: 5
    },
    {
        name: "Factory",
        icon: "🏭",
        baseCost: 3000,
        cps: 25
    },
    {
        name: "Mine",
        icon: "⛏️",
        baseCost: 10000,
        cps: 100
    },
    {
        name: "Bank",
        icon: "🏦",
        baseCost: 50000,
        cps: 500
    },
    {
        name: "Temple",
        icon: "🛕",
        baseCost: 250000,
        cps: 2500
    },
    {
        name: "Wizard Tower",
        icon: "🧙",
        baseCost: 1000000,
        cps: 10000
    }
];

buildingTypes.forEach(() => buildings.push(0));

const cookieDisplay = document.getElementById("cookies");
const cpsDisplay = document.getElementById("cps");
const bigCookie = document.getElementById("bigCookie");
const cookieArea = document.getElementById("cookieArea");
const buildingList = document.getElementById("buildingList");

function formatNumber(number) {
    if (number < 1000) return Math.floor(number).toString();

    const units = ["K", "M", "B", "T", "Qa", "Qi"];
    let unit = -1;

    while (number >= 1000 && unit < units.length - 1) {
        number /= 1000;
        unit++;
    }

    return number.toFixed(number < 10 ? 1 : 0) + units[unit];
}

function getCost(index) {
    return Math.floor(
        buildingTypes[index].baseCost *
        Math.pow(1.15, buildings[index])
    );
}

function getCPS() {
    let total = 0;

    buildingTypes.forEach((building, index) => {
        total += building.cps * buildings[index];
    });

    return total;
}

function update() {
    cookieDisplay.textContent =
        formatNumber(cookies) + " cookies";

    cpsDisplay.textContent =
        formatNumber(getCPS()) + " cookies per second";

    renderBuildings();
}

function renderBuildings() {
    buildingList.innerHTML = "";

    buildingTypes.forEach((building, index) => {
        const cost = getCost(index);

        const card = document.createElement("div");
        card.className = "building";

        card.innerHTML = `
            <div class="building-icon">${building.icon}</div>

            <div>
                <div class="building-name">
                    ${building.name} × ${buildings[index]}
                </div>

                <div class="building-info">
                    +${building.cps} cookies/sec
                </div>
            </div>

            <button class="buy" ${cookies < cost ? "disabled" : ""}>
                🍪 ${formatNumber(cost)}
            </button>
        `;

        card.querySelector(".buy").addEventListener("click", () => {
            if (cookies >= cost) {
                cookies -= cost;
                buildings[index]++;
                update();
            }
        });

        buildingList.appendChild(card);
    });
}

/* CLICK COOKIE */
bigCookie.addEventListener("click", (event) => {
    cookies++;

    createFloat(event.clientX, event.clientY, "+1");
    update();
});

/* FLOATING NUMBER */
function createFloat(x, y, text) {
    const float = document.createElement("div");

    float.className = "float";
    float.textContent = text;

    const rect = cookieArea.getBoundingClientRect();

    float.style.left = (x - rect.left) + "px";
    float.style.top = (y - rect.top) + "px";

    cookieArea.appendChild(float);

    setTimeout(() => {
        float.remove();
    }, 800);
}

/* AUTOMATIC COOKIES */
setInterval(() => {
    const cps = getCPS();

    if (cps > 0) {
        cookies += cps / 10;
        update();
    }
}, 100);

/* START */
update();
</script>

</body>
</html>
